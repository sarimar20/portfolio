<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proyectos — Sara Martinez</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Xanh+Mono:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="proyectos">
  <main class="page">
    <h1 class="page__title" data-i18n="projects.title">Proyectos</h1>
    <div class="grid" id="grid"></div>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/projects-data.js"></script>
  <script>
    document.getElementById("grid").innerHTML = window.PROJECTS.map((p) => `
      <a class="card" href="proyecto.html?p=${p.slug}">
        <img src="${p.cover.thumb}" alt="" loading="lazy">
        <span class="card__name">${p.title}</span>
      </a>`).join("");
  </script>
</body>
</html>
