<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cross Stitch SVG</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1b1b1b; --muted: #6b6b6b;
    --line: #e2e0db; --accent: #1b1b1b;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .app { display: grid; grid-template-columns: 300px 1fr; min-height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); padding: 20px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
  h1 { font-size: 16px; margin: 0; letter-spacing: .02em; }
  .drop { border: 1.5px dashed var(--line); border-radius: 10px; padding: 18px; text-align: center; color: var(--muted); cursor: pointer; transition: border-color .15s, background .15s; }
  .drop:hover, .drop.over { border-color: var(--ink); background: #faf9f7; }
  .drop img { max-width: 100%; max-height: 120px; display: block; margin: 0 auto 8px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .field label span { color: var(--ink); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .row { display: flex; gap: 12px; }
  .row .field { flex: 1; }
  input[type=color] { width: 100%; height: 32px; border: 1px solid var(--line); border-radius: 6px; padding: 2px; background: #fff; }
  select { width: 100%; padding: 7px; border: 1px solid var(--line); border-radius: 6px; background: #fff; font: inherit; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  button { padding: 11px; border: 0; border-radius: 8px; background: var(--ink); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .35; cursor: default; }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
  main { display: flex; align-items: center; justify-content: center; padding: 32px; overflow: auto; }
  #preview { max-width: 100%; max-height: calc(100vh - 64px); box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 30px rgba(0,0,0,.06); background: #fff; }
  #preview svg { display: block; width: 100%; height: auto; max-height: calc(100vh - 64px); }
  .empty { color: var(--muted); }
  .stats { font-size: 12px; color: var(--muted); }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); padding: 16px; }
    main { padding: 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Cross Stitch → SVG</h1>

    <div class="drop" id="drop">
      <div id="dropContent">Arrastrá una imagen o hacé click</div>
      <input type="file" id="file" accept="image/*" hidden>
    </div>

    <div class="field">
      <label>Puntadas de ancho <span id="colsV">60</span></label>
      <input type="range" id="cols" min="10" max="200" value="60">
    </div>

    <div class="field">
      <label>Modo</label>
      <select id="mode">
        <option value="mono">Monocromo (umbral)</option>
        <option value="color">Colores de la imagen</option>
      </select>
    </div>

    <div class="field" id="thresholdField">
      <label>Umbral <span id="thresholdV">128</span></label>
      <input type="range" id="threshold" min="1" max="254" value="128">
    </div>

    <div class="field" id="levelsField" hidden>
      <label>Niveles de color <span id="levelsV">4</span></label>
      <input type="range" id="levels" min="2" max="8" value="4">
    </div>

    <label class="check"><input type="checkbox" id="invert"> Invertir</label>

    <div class="field">
      <label>Grosor del hilo <span id="thickV">30%</span></label>
      <input type="range" id="thick" min="10" max="50" value="30">
    </div>

    <div class="field">
      <label>Separación <span id="gapV">8%</span></label>
      <input type="range" id="gap" min="0" max="30" value="8">
    </div>

    <div class="row">
      <div class="field" id="inkField">
        <label>Hilo</label>
        <input type="color" id="ink" value="#000000">
      </div>
      <div class="field">
        <label>Fondo</label>
        <input type="color" id="bg" value="#ffffff">
      </div>
    </div>
    <label class="check"><input type="checkbox" id="transparent"> Fondo transparente en SVG</label>

    <div class="stats" id="stats"></div>

    <button id="copy" disabled>Copiar SVG</button>
    <button id="export" class="ghost" disabled>Exportar SVG</button>
    <button id="exportPng" class="ghost" disabled>Exportar PNG</button>
  </aside>

  <main>
    <div id="preview"><div class="empty">Subí una imagen de referencia para empezar</div></div>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
const CELL = 10; // tamaño de cada celda en unidades SVG
let img = null;
let lastSvg = '';
let lastSize = [0, 0];

// --- carga de imagen ---
const drop = $('drop'), fileInput = $('file');
drop.addEventListener('click', () => fileInput.click());
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('over');
  if (e.dataTransfer.files[0]) load(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => fileInput.files[0] && load(fileInput.files[0]));
window.addEventListener('paste', e => {
  const item = [...e.clipboardData.items].find(i => i.type.startsWith('image/'));
  if (item) load(item.getAsFile());
});

function load(file) {
  const url = URL.createObjectURL(file);
  const im = new Image();
  im.onload = () => {
    img = im;
    $('dropContent').innerHTML = `<img src="${url}"><small>Cambiar imagen</small>`;
    $('copy').disabled = $('export').disabled = $('exportPng').disabled = false;
    render();
  };
  im.src = url;
}

// --- controles ---
['cols','threshold','levels','thick','gap','ink','bg','invert','mode','transparent'].forEach(id =>
  $(id).addEventListener('input', render));

function render() {
  $('colsV').textContent = $('cols').value;
  $('thresholdV').textContent = $('threshold').value;
  $('levelsV').textContent = $('levels').value;
  $('thickV').textContent = $('thick').value + '%';
  $('gapV').textContent = $('gap').value + '%';
  const color = $('mode').value === 'color';
  $('thresholdField').hidden = color;
  $('levelsField').hidden = !color;
  $('inkField').style.opacity = color ? .35 : 1;
  if (!img) return;

  const cols = +$('cols').value;
  const rows = Math.max(1, Math.round(cols * img.height / img.width));
  const c = document.createElement('canvas');
  c.width = cols; c.height = rows;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cols, rows); // transparencia = blanco
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0, cols, rows);
  const data = ctx.getImageData(0, 0, cols, rows).data;

  const thr = +$('threshold').value;
  const inv = $('invert').checked;
  const levels = +$('levels').value;
  const step = 255 / (levels - 1);
  const q = v => Math.round(Math.round(v / step) * step);
  const hex = (r, g, b) => '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
  const bgHex = $('bg').value.toLowerCase();

  // agrupa los segmentos por color -> un <path> por color
  const groups = new Map();
  const inset = CELL * (+$('gap').value / 100);
  const a = inset, b = CELL - inset;
  let count = 0;

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const i = (y * cols + x) * 4;
      const r = data[i], g = data[i + 1], bl = data[i + 2];
      const lum = 0.299 * r + 0.587 * g + 0.114 * bl;
      let fill;
      if (color) {
        const isLight = lum > 245;           // descarta el blanco de fondo
        if (isLight !== inv) continue;
        fill = hex(q(r), q(g), q(bl));
        if (fill === bgHex) continue;
      } else {
        if ((lum < thr) === inv) continue;
        fill = $('ink').value;
      }
      const ox = x * CELL, oy = y * CELL;
      const d = `M${ox + a} ${oy + a}L${ox + b} ${oy + b}M${ox + b} ${oy + a}L${ox + a} ${oy + b}`;
      if (!groups.has(fill)) groups.set(fill, []);
      groups.get(fill).push(d);
      count++;
    }
  }

  const W = cols * CELL, H = rows * CELL;
  const sw = (CELL * +$('thick').value / 100).toFixed(2);
  const bgRect = $('transparent').checked ? '' : `<rect width="${W}" height="${H}" fill="${$('bg').value}"/>`;
  const paths = [...groups].map(([fill, ds]) =>
    `<path d="${ds.join('')}" stroke="${fill}"/>`).join('\n  ');

  lastSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
  ${bgRect}
  <g fill="none" stroke-width="${sw}" stroke-linecap="square">
  ${paths}
  </g>
</svg>`;
  lastSize = [W, H];

  $('preview').style.background = $('bg').value;
  $('preview').innerHTML = lastSvg;
  $('stats').textContent = `${cols} × ${rows} celdas · ${count.toLocaleString('es')} puntadas · ${groups.size} color${groups.size === 1 ? '' : 'es'}`;
}

// --- exportar ---
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$('copy').addEventListener('click', async () => {
  const btn = $('copy');
  try {
    await navigator.clipboard.writeText(lastSvg);
  } catch {
    // fallback para file:// u otros contextos sin permiso de portapapeles
    const ta = document.createElement('textarea');
    ta.value = lastSvg; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
  btn.textContent = '¡Copiado! Pegalo en Figma';
  setTimeout(() => btn.textContent = 'Copiar SVG', 1800);
});
$('export').addEventListener('click', () =>
  download(new Blob([lastSvg], { type: 'image/svg+xml' }), 'cross-stitch.svg'));

$('exportPng').addEventListener('click', () => {
  const scale = Math.max(1, Math.ceil(2000 / lastSize[0]));
  const im = new Image();
  im.onload = () => {
    const c = document.createElement('canvas');
    c.width = lastSize[0] * scale; c.height = lastSize[1] * scale;
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    c.toBlob(b => download(b, 'cross-stitch.png'));
  };
  im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(lastSvg);
});

render();
</script>
</body>
</html>
